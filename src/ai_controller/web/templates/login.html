<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in – SamiGPT</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 8px;
            padding: 32px;
            width: 100%;
            max-width: 380px;
        }
        h1 { font-size: 20px; color: #fff; margin-bottom: 6px; }
        p { font-size: 13px; color: #858585; margin-bottom: 24px; }
        label { display: block; font-size: 13px; margin: 12px 0 6px; }
        input {
            width: 100%;
            padding: 10px 12px;
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            color: #d4d4d4;
            font-size: 14px;
        }
        input:focus { outline: none; border-color: #007acc; }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 10px 16px;
            background: #007acc;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        button:hover { background: #005a9e; }
        button:disabled { background: #3e3e42; cursor: not-allowed; }
        .error {
            display: none;
            margin-top: 12px;
            font-size: 13px;
            color: #f48771;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>SamiGPT</h1>
        <p>Sign in to the SOC AI orchestrator</p>
        <form id="login-form">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required autofocus>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit" id="login-btn">Sign in</button>
            <div class="error" id="error"></div>
        </form>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const button = document.getElementById('login-btn');
            const error = document.getElementById('error');
            error.style.display = 'none';
            button.disabled = true;
            button.textContent = 'Signing in…';
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value,
                    }),
                });
                const data = await response.json().catch(() => ({}));
                if (response.ok && data.success) {
                    const next = new URLSearchParams(window.location.search).get('next') || '/';
                    window.location.href = next.startsWith('/') ? next : '/';
                    return;
                }
                error.textContent = data.detail || 'Invalid username or password';
                error.style.display = 'block';
            } catch (err) {
                error.textContent = err.message || 'Sign-in failed';
                error.style.display = 'block';
            }
            button.disabled = false;
            button.textContent = 'Sign in';
        });
    </script>
</body>
</html>
