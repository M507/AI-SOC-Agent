<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in – SamiGPT</title>
    <script>
        (function () {
            var key = 'samigpt.appearance';
            var mode = 'u';
            try {
                var stored = JSON.parse(localStorage.getItem(key) || '{}');
                if (stored && ['u', 'ft', 'b', 'system'].indexOf(stored.mode) !== -1) {
                    mode = stored.mode;
                }
            } catch (e) {}
            var theme = mode === 'system'
                ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'b' : 'u')
                : mode;
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.setAttribute('data-appearance-mode', mode);
        })();
    </script>
    <link rel="stylesheet" href="/static/css/tokens.css?v=1">
    <link rel="stylesheet" href="/static/css/base.css?v=3">
    <link rel="stylesheet" href="/static/css/login.css?v=1">
</head>
<body class="login-page">
    <div class="card">
        <h1>SamiGPT</h1>
        <p>Sign in to the SOC AI orchestrator</p>
        <form id="login-form">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required autofocus>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit" id="login-btn">Sign in</button>
            <div class="error" id="error"></div>
        </form>
    </div>
    <script src="/static/theme.js?v=1"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const button = document.getElementById('login-btn');
            const error = document.getElementById('error');
            error.style.display = 'none';
            button.disabled = true;
            button.textContent = 'Signing in…';
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value,
                    }),
                });
                const data = await response.json().catch(() => ({}));
                if (response.ok && data.success) {
                    const next = new URLSearchParams(window.location.search).get('next') || '/';
                    window.location.href = next.startsWith('/') ? next : '/';
                    return;
                }
                error.textContent = data.detail || 'Invalid username or password';
                error.style.display = 'block';
            } catch (err) {
                error.textContent = err.message || 'Sign-in failed';
                error.style.display = 'block';
            }
            button.disabled = false;
            button.textContent = 'Sign in';
        });
    </script>
</body>
</html>
